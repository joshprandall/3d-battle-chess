name: Fix v4 castle and mobile skip controls
on:
  push:
    branches: [feature/castling-cinematic-v4]
    paths: ['.github/workflows/fix-v4-ui.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch only game controller and duel UI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('battle.js');s=p.read_text()
          before="const form=$('#moveForm');if(form)form.addEventListener('submit',"
          after="const form=$('#moveForm');if(form)form.noValidate=true;if(form)form.addEventListener('submit',"
          assert s.count(before)==1,'expected form input binding missing'
          p.write_text(s.replace(before,after,1))
          p=Path('duels.js');s=p.read_text()
          before="if(stage&&matchMedia('(max-width:850px)').matches)stage.scrollIntoView({block:'start',behavior:'auto'});"
          after="if(stage&&matchMedia('(max-width:850px)').matches){stage.style.scrollMarginTop='64px';stage.scrollIntoView({block:'start',behavior:'auto'});}"
          assert s.count(before)==1,'expected mobile scroll binding missing'
          p.write_text(s.replace(before,after,1))
          PY
          node --check battle.js
          node --check duels.js
          rm .github/workflows/fix-v4-ui.yml
      - name: Commit scoped controller fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add battle.js duels.js .github/workflows/fix-v4-ui.yml
          git commit -m 'Accept O-O castling and keep mobile skip accessible'
          git push origin HEAD:feature/castling-cinematic-v4
