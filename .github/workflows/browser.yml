name: Browser smoke
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/combat-physics.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.mjs
      - run: node tests/character-duels.mjs
      - run: node tests/v6-fighters.mjs
      - run: node tests/v6-role-contact.mjs
      - run: node tests/ux-v7.mjs
      - run: node tests/v8-browser.mjs
      - run: node tests/v8-preview.mjs
      - run: node tests/v8-game-integration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battle-chess-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
      - name: Package isolated OSU web game
        run: |
          zip -j artifacts/battle-chess-osu-deploy.zip index.html styles.css battle.js engine.js pieces.js attacks.js characters.js combatants.js duels.js duels-physics.js combat-physics.js castle-controls.js combatants-v6.js duels-v6.js duels-v8.js audio.js
          zip -r artifacts/battle-chess-osu-deploy.zip combat-v8
      - uses: actions/upload-artifact@v4
        with:
          name: battle-chess-osu-deploy
          path: artifacts/battle-chess-osu-deploy.zip
          if-no-files-found: error
