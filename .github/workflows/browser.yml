name: Browser smoke
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.mjs
      - run: node tests/character-duels.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battle-chess-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
      - name: Package isolated OSU web game
        run: zip -j artifacts/battle-chess-osu-deploy.zip index.html styles.css battle.js engine.js pieces.js attacks.js characters.js duels.js castle-controls.js
      - uses: actions/upload-artifact@v4
        with:
          name: battle-chess-osu-deploy
          path: artifacts/battle-chess-osu-deploy.zip
          if-no-files-found: error
