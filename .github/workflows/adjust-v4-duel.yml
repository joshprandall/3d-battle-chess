name: Improve v4 duel framing
on:
  push:
    branches: [feature/castling-cinematic-v4]
    paths: ['.github/workflows/adjust-v4-duel.yml']
permissions:
  contents: write
jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Adjust framing and keep skip control visible on phones
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('duels.js'); s=p.read_text()
          pairs=[
            ('new THREE.CylinderGeometry(3.4,3.5,.13,48)','new THREE.CylinderGeometry(2.95,3.03,.13,48)'),
            ('new THREE.TorusGeometry(2.72,.035,6,72)','new THREE.TorusGeometry(2.62,.035,6,72)'),
            ('arena.add(fighter,defender);','fighter.scale.setScalar(1.65);defender.scale.setScalar(1.65);\n arena.add(fighter,defender);'),
            ("stage?.append(ui);","stage?.append(ui);\n if(stage&&matchMedia('(max-width:850px)').matches)stage.scrollIntoView({block:'start',behavior:'auto'});"),
            ('new THREE.Vector3(0,2.65,6.0)','new THREE.Vector3(0,2.55,5.25)'),
            ('defender.scale.set(1+.10*reaction,1-.27*reaction,1);','defender.scale.set(1.65*(1+.10*reaction),1.65*(1-.27*reaction),1.65);'),
          ]
          for before,after in pairs:
            assert s.count(before)==1,repr(before)
            s=s.replace(before,after,1)
          p.write_text(s)
          PY
          node --check duels.js
          rm .github/workflows/adjust-v4-duel.yml
      - name: Commit scope-limited change
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add duels.js .github/workflows/adjust-v4-duel.yml
          git commit -m 'Enlarge capture characters and keep mobile duel in view'
          git push origin HEAD:feature/castling-cinematic-v4
