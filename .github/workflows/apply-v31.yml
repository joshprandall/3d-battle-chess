name: Apply v3.1 contrast patch
on:
  push:
    branches: [feature/v3-1-contrast-balance]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Activate v3.1 contrast patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update three game files, leaving portfolio and fallback untouched
        run: python3 tools/contrast-v31.py
      - name: Check the three JavaScript files and patch hygiene
        run: |
          node --check pieces.js
          node --check characters.js
          node --check battle.js
          git diff --check
      - name: Commit the verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pieces.js characters.js battle.js
          git commit -m 'Balance piece contrast, board palette and game lighting in v3.1'
          git push origin HEAD:feature/v3-1-contrast-balance
