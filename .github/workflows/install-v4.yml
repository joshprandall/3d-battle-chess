name: Install v4 game update
on:
  push:
    branches: [feature/castling-cinematic-v4]
    paths: ['.github/workflows/install-v4.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and install scoped source files
        run: |
          set -euo pipefail
          sha256sum tools/v4-payload*.b64
          cat tools/v4-payload.b64 tools/v4-payload-0b.b64 tools/v4-payload-1.b64 tools/v4-payload-2.b64 tools/v4-payload-3.b64 >/tmp/chess-payload.b64
          echo 'f5c150187e7f47efc127057f6308d02b6da51c91070eb7e636351923cc6d4ad3  /tmp/chess-payload.b64' | sha256sum -c -
          base64 -d /tmp/chess-payload.b64 >/tmp/chess-v4-payload.tar.xz
          echo '95fc5d5bfce6806b935b50ed6a4cc973a5b042da7778f89b654eed4d5c0e980d  /tmp/chess-v4-payload.tar.xz' | sha256sum -c -
          tar -tJf /tmp/chess-v4-payload.tar.xz
          tar -xJf /tmp/chess-v4-payload.tar.xz
          rm tools/v4-payload*.b64 .github/workflows/install-v4.yml
          node --check battle.js
          node --check duels.js
          node --check castle-controls.js
          node --test tests/castling-ui.test.mjs
      - name: Commit verified v4 source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Improve castling input and stage two-character battles'
          git push origin HEAD:feature/castling-cinematic-v4
